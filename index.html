<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guess Game</title>
    <!-- You may change the CSS location based on your file structure-->
    <link rel="stylesheet" href="public/css/guesss-game.css" />
  </head>
  <body>
    <div class="main-container">
      <h2>Guess Game</h2>
      <div class="instruction">
        Guess a number between 1 - 20, you have 5 chances.
      </div>
      <div class="input">
        <input type="text" id="guess-value" name="guess-value" />
        <button id="guess-btn">Guess!</button>
        <button id="restart-btn">Restart</button>
      </div>
      <hr />
      <div id="attempt-text">
        Attempt <span id="attempt">0</span>/5
      </div>
      <div id="result"></div>
    </div>
    <script src="public/js/guess-game.js"></script>
  </body>
</html>
